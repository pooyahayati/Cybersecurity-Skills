name: Package and control validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing-diagnosis:
    name: Synthetic Windows 3.11 timing diagnosis
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Observe unchanged synthetic tests and bounded process timings
        run: python -B .github/diagnostics/windows_process.py
